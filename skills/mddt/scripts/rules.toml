# Detection registry for mddt.py.
# Codes are permanent identifiers; severity may change without renaming a code.
# `rule` is a path under the skill's references/ directory.
# Fix guidance for each code lives in fixes.toml under the same key.

[h1-missing]
severity = "error"
group = "structure"
summary = "file has no level-1 heading"
rule = "model.md#files-and-topics"

[h1-multiple]
severity = "error"
group = "structure"
summary = "file has more than one level-1 heading"
rule = "model.md#files-and-topics"

[h1-overview]
severity = "error"
group = "structure"
summary = "level-1 heading lacks an overview paragraph"
rule = "model.md#files-and-topics"

[heading-skip]
severity = "error"
group = "structure"
summary = "heading level is skipped"
rule = "model.md#headings-and-promotion"

[heading-number]
severity = "error"
group = "structure"
summary = "sibling headings carry section numbers"
rule = "model.md#headings-and-promotion"

[heading-depth]
severity = "error"
group = "structure"
summary = "heading is deeper than H3"
rule = "model.md#files-and-topics"

[topic-overview]
severity = "error"
group = "structure"
summary = "topic H2 lacks an overview paragraph"
rule = "model.md#headings-and-promotion"

[name-nesting]
severity = "error"
group = "structure"
summary = "named list item has a named descendant"
rule = "model.md#lists"

[bold-heading]
severity = "error"
group = "structure"
summary = "emphasized paragraph is used as a heading"
rule = "model.md#headings-and-promotion"

[list-depth-4]
severity = "error"
group = "structure"
summary = "list is nested four or more levels deep"
rule = "model.md#lists"

[list-intro]
severity = "error"
group = "structure"
summary = "list does not start with an introductory paragraph"
rule = "model.md#lists"

[table-intro]
severity = "error"
group = "structure"
summary = "table does not start with an introductory paragraph"
rule = "model.md#sections-lists-and-tables"

[heading-intro]
severity = "warning"
group = "structure"
summary = "heading introduces a list or table that a paragraph follows"
rule = "model.md#lists"

[list-single]
severity = "error"
group = "structure"
summary = "list has only one item"
rule = "model.md#lists"

[section-count]
severity = "warning"
group = "structure"
summary = "more than seven sibling sections without mechanical order"
rule = "model.md#siblings"

[part-after-topic]
severity = "warning"
group = "structure"
summary = "part H2 follows a topic H2"
rule = "model.md#headings-and-promotion"

[topic-single-child]
severity = "warning"
group = "structure"
summary = "topic H2 has only one H3"
rule = "model.md#headings-and-promotion"

[list-depth-3]
severity = "warning"
group = "structure"
summary = "list is nested three levels deep"
rule = "model.md#lists"

[list-length]
severity = "warning"
group = "structure"
summary = "list has more than seven items without mechanical order"
rule = "model.md#lists"

[name-form-mix]
severity = "warning"
group = "structure"
summary = "list item names mix forms within one topic"
rule = "model.md#lists"

[doc-unlinked]
severity = "error"
group = "structure"
summary = "parent document does not link to this document"
rule = "model.md#links-between-documents"

[anchor-to-part]
severity = "info"
group = "structure"
summary = "link from another file points to a part"
rule = "model.md#links-between-documents"

[paragraph-length]
severity = "warning"
group = "sentence"
summary = "paragraph has more than five sentences"
rule = "model.md#paragraphs-and-sentences"

[paragraph-run]
severity = "warning"
group = "sentence"
summary = "four or more paragraphs follow each other without other structure"
rule = "model.md#paragraphs-and-sentences"

[sentence-length]
severity = "warning"
group = "sentence"
summary = "sentence has more than 25 words"
rule = "model.md#paragraphs-and-sentences"

[line-sentences]
severity = "warning"
group = "sentence"
summary = "line holds more than one sentence"
rule = "model.md#paragraphs-and-sentences"

[link-without-summary]
severity = "info"
group = "structure"
summary = "link to a child document has no summary"
rule = "model.md#links-between-documents"

[sibling-imbalance]
severity = "info"
group = "structure"
summary = "section is much larger than its siblings"
rule = "model.md#siblings"

[file-size]
severity = "info"
group = "structure"
summary = "file is long enough to reconsider its division"
rule = "model.md#files-and-topics"

[item-name]
severity = "info"
group = "structure"
summary = "list item of several sentences has no name"
rule = "model.md#names"

[nested-block]
severity = "info"
group = "structure"
summary = "list item of several sentences is nested with named items"
rule = "model.md#names"
