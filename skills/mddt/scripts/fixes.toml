# Fix guidance printed with each code's findings.
# Kept in one file so that related codes can share consistent wording and option order.
# Keys match the codes in rules.toml.

h1-missing = """
Add one level-1 heading at the top that names the document, so the title can be understood without the file path.
Avoid promoting a section heading to H1 without adjusting the levels below it.
"""

h1-multiple = """
Fix, in order of preference:
1. If the file holds several documents, split it into one file per H1 and link the files from a parent document.
2. Otherwise demote the extra H1 headings to H2 and adjust the levels below them.
"""

h1-overview = """
Write an overview paragraph right after the H1 that says what the document is and what it covers, so a reader arriving from anywhere can decide whether to read on.
Badge-only paragraphs do not count as an overview.
Avoid repeating the title, or moving the first section's opening sentence up as a stand-in.
"""

heading-skip = """
Fix, in order of preference:
1. Insert the missing intermediate heading if the content has that grouping.
2. Otherwise raise the heading to the level right below its parent.
"""

heading-number = """
Remove the section numbers and let heading levels and titles carry the hierarchy.
Update anchors and links that contained the numbers.
Keep numbers that belong to the subject, such as versions, dates, and identifiers.
"""

heading-depth = """
Fix, in order of preference:
1. Move the H3 section that contains the deeper headings into its own file, leave a summary and a link in its original place, and rebuild the deeper headings as that file's H2 and H3.
2. If the deeper parts are short, remove their headings and write them as named list items.
Avoid:
- Bold paragraphs used as headings.
- Raising the deeper headings to H3 so that the hierarchy is flattened.
"""

topic-overview = """
Fix, in order of preference:
1. Write an overview paragraph between the H2 and its first H3.
2. If the H3 headings are not needed, remove them so that the H2 becomes a part.
Avoid moving the first H3's opening text up as a stand-in.
"""

name-nesting = """
Fix in one of these ways:
1. Promote the outer name to a heading so that the named children become its content.
2. Remove the names from the inner items.
3. Remove the outer name and turn it into an introductory sentence.
Avoid:
- Removing only the bold while keeping a "Name:" form, which is still a name.
- Merging the children into one long sentence.
"""

bold-heading = """
Turn it into a real heading (H3 at most), a named list item, or a plain sentence.
Avoid creating an H4 to keep it as a heading.
"""

list-depth-4 = """
Fix, in order of preference:
1. Fold the deepest level into its parent item's sentence.
2. Promote an upper level to a heading.
3. Split the list into separate lists, each with its own introduction.
Avoid cramming several items into one long sentence.
"""

list-intro = """
Fix, in order of preference:
1. If a code block or other block next to the list belongs to one of its items, such as a step's command, indent it into that item.
   It then counts as part of the list, which also rejoins a list that the block split in two.
2. Add a sentence before the list that says what the list contains.
3. Move the list into its own section so that it is the section's only content and the heading introduces it.
Avoid a filler sentence such as "The following:" or one that repeats the heading, since neither says what the list is.
"""

table-intro = """
Fix, in order of preference:
1. Add a sentence before the table that says what it compares or lists.
2. Move the table into its own section so that it is the section's only content and the heading introduces it.
Avoid a filler sentence, or one that repeats the heading, since neither says what the table holds.
"""

heading-intro = """
The heading may introduce a list or table that opens the section even when paragraphs follow it; keeping it is a valid outcome.
1. Keep it when the heading says what the list or table holds and the paragraphs after it comment on it, such as caveats or limits.
2. If the content after it continues the same kind of items, such as decisions outside a table of decisions, merge them into the list or table.
3. Otherwise add a sentence before it that states its scope, such as which of the section's decisions it holds.
Avoid a sentence that only repeats the heading, such as "The decisions are as follows:".
It adds nothing, and it can claim that the list or table covers the whole section.
Removing such a sentence can raise this warning, which is the expected result.
"""

list-single = """
Write the item as a sentence or paragraph.
"""

section-count = """
Many sibling sections are hard to scan unless their order is mechanical; keeping them is a valid outcome.
The checker recognizes order by name, by number, or by a date written year first in digits, such as 2026-11-03, anywhere in each title.
1. Group related sections under a topic, or move a group to its own file.
2. Merge sections that do not need their own heading into lists or tables.
3. Keep them when restructuring would cost more than it helps.
"""

part-after-topic = """
A parent's own parts come before its subtopics.
Fix, in order of preference:
1. Move the part before the topics.
2. Keep it when it is really a short subtopic that the checker reads as a part because it has no H3.
"""

topic-single-child = """
Fix, in order of preference:
1. Remove the H3 heading so that the H2 becomes a part, when the single H3 does not divide the topic.
2. Keep it when other documents link to the H3.
"""

list-depth-3 = """
Reconsider whether the third level is needed; keeping it is a valid outcome.
1. Fold the deepest level into its parent item's sentence.
2. Promote an upper level to a heading.
3. Split the list.
4. Keep it when all three levels carry meaning.
Avoid cramming items into one long sentence to silence the warning.
"""

list-length = """
Long lists are hard to scan unless their order is mechanical; keeping the list is a valid outcome.
The checker recognizes order by name, by number, or by a date written year first in digits, such as 2026-11-03, anywhere in each item.
1. Group items by role into sublists, noting that this adds a nesting level.
2. Turn the list into a table if the items share attributes.
3. Promote groups to headings.
4. Sort the items alphabetically or numerically when readers look them up by name.
5. Keep it.
"""

name-form-mix = """
Use one name form within a topic; in new writing, use bold names.
Link text is not counted, so this finding concerns bold terms and phrases followed by a colon.
"""

doc-unlinked = """
Fix, in order of preference:
1. Link to the document from its parent with a short summary of its overview.
2. If the document belongs under another parent, move it to that parent's folder or companion folder.
3. If the file is not a document, such as a template, fixture, or artifact, skip it with --exclude.
Avoid linking it only from a sibling; a lateral link does not place it in the tree.
"""

link-broken = """
Fix, in order of preference:
1. If the target moved or was renamed, link to its current path, which is relative to the linking file.
2. If the target was removed, link to the content that replaced it, or remove the link and keep the sentence.
Avoid recreating a file at the old path only to satisfy the link.
"""

anchor-missing = """
Fix, in order of preference:
1. If the heading was renamed or moved, link to its current anchor: the heading text in lowercase, without punctuation, with spaces as hyphens.
2. If the section was removed, link to the file or to the section that now holds the content.
3. If the anchor works where the documents are read, keep it, or mark the target with an HTML element such as <a id="name"></a>.
The checker approximates GitHub's heading IDs, which differ for some characters, such as combining marks, emoji variation selectors, and superscript digits.
"""

anchor-to-part = """
This is information for structural review; most such links only locate content in a file that the reader reads whole.
A link that expects its target to be read alone should point to a topic.
1. Promote the target to a topic when readers are meant to read it on its own.
2. Link to the file instead of the section.
3. Keep the anchor when it only locates content in a file that the reader reads whole.
"""

paragraph-length = """
Keeping the paragraph is a valid outcome when it is one line of argument.
1. Turn parallel points into a list, or points with shared attributes into a table.
2. Split the paragraph where its subject shifts.
"""

paragraph-run = """
Long runs of paragraphs often hide structure; keeping them is a valid outcome for continuous argument.
1. Turn parallel points into a list, or points with shared attributes into a table.
2. Start a section where the subject changes.
"""

sentence-length = """
Fix, in order of preference:
1. Split the sentence.
2. Check whether its parts belong in separate sections or list items.
3. Keep it, breaking the line at a clause boundary if that helps reading.
Avoid breaking lines only to hide the length.
A sentence is counted across line breaks until a line ends with sentence punctuation or a colon, and code spans, link targets, and URLs are not counted.
"""

line-sentences = """
Start each sentence on its own line; in a list item, put later sentences on indented continuation lines.
Keep the line when the period belongs to an abbreviation, a version, or a name.
Within a line, a new sentence is recognized after sentence punctuation and a space, when Korean text ends the sentence, a full-width stop is used, or a capital letter follows.
"""

link-without-summary = """
Information for structural review.
Add a short summary after the link, condensed from the child's overview, so that readers can choose a path without opening every child.
"""

sibling-imbalance = """
Information for structural review; siblings may differ in size for good reasons.
1. If the section holds finer or broader detail than its siblings, move that detail to a topic at its own level and link to it.
2. If the section has grown into a subject of its own, promote it to a topic or a file.
"""

file-size = """
Information for structural review; a long file may still be one coherent topic set.
1. Move topics that serve another reader or task into their own files, placed as writing.md's Placing a document describes, leaving summaries and links.
2. Check whether parts of the file belong to another kind or level.
"""

item-name = """
Information for structural review.
An item of several sentences is a block of its own; give it a bold name that says what it is about.
"""

nested-block = """
Information for structural review; blocks nested in blocks suggest a missing heading.
1. Promote the enclosing item, named or not, to a heading so that the inner items can carry names.
2. Shorten the item of several sentences into one sentence when it is only a detail.
"""
